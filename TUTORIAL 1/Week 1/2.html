<!DOCTYPE html>
<html>
    <head>
        <!-- 1. VIEWPORT META TAG: Makes the page look good on phone -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Simple Page</title>
    </head>

    <!-- 2. BODY TAG: Everything inside here shows up on the screen -->
     <body bgcolor="teal">

        <!-- 3. HEADINGS (h1 to h6): Big Titles get smaller as the number goes up -->
        <h1 align="center">This is Heading 1 (Biggest)</h1>
        <h2>This is Heading 2</h2>
        <h3>This is Heading 3</h3>

        <!-- 4. PARAGRAPH: Regular blocks of text -->
        <p>This is normal paragraph. It is used for writing sentences and long text</p>

        <!-- 5. UNORDERED LIST: A bullet-point list -->
         <p>My favorite fruits:</p>
         <ul>
            <li>Apples</li>
            <li>Bananas</li>
            <li>Cherries</li>
         </ul>

         <!-- 6. LINK: Clicking this takes you to another website -->
         <p>Visit <a href="https://www.google.com">Google here</a> Click the blue text</p>

         <!-- 7. IMAGE: Shows a picture on your page -->
          <p>Here is a placeholder image</p>

    <!-- Use the direct image file URL, not the Wikipedia webpage URL -->
    <img src="https://miro.medium.com/v2/resize:fit:1200/1*1X0-98EiQNkwBJj2vnTTqQ.jpeg" alt="This is placeholder image">

     </body>
</html>
