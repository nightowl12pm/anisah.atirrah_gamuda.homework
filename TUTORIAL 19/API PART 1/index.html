<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Text Translator</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f4f7; display: flex; justify-content: center; padding: 40px; }
    .card { background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.15); width: 640px; }
    h1 { text-align: center; font-size: 22px; }
    .row { display: flex; gap: 16px; margin-bottom: 16px; }
    .row > * { flex: 1; }
    select, textarea { width: 100%; padding: 8px; font-size: 15px; box-sizing: border-box; }
    textarea { height: 120px; }
    button { display: block; margin: 0 auto; padding: 10px 28px; background: #1565c0; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Text Translator</h1>
    <div class="row">
      <select id="inLang"><option>English</option><option>German</option><option>Malay</option><option>French</option><option>Japanese</option></select>
      <select id="outLang"><option>German</option><option>English</option><option>Malay</option><option>French</option><option>Japanese</option></select>
    </div>
    <div class="row">
      <textarea id="inText" placeholder="Enter text to translate"></textarea>
      <textarea id="outText" placeholder="Translation" readonly></textarea>
    </div>
    <button id="btn">TRANSLATE</button>
  </div>

  <script>
    const btn = document.getElementById("btn");
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      document.getElementById("outText").value = "Translating...";
      try {
        const res = await fetch("http://127.0.0.1:8000/translate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            input_language: document.getElementById("inLang").value,
            output_language: document.getElementById("outLang").value,
            text_input: document.getElementById("inText").value
          })
        });
        const data = await res.json();
        document.getElementById("outText").value = res.ok ? data.translated_text : "Error: " + data.detail;
      } catch (err) {
        document.getElementById("outText").value = "Cannot reach the server. Is uvicorn running?";
      }
      btn.disabled = false;
    });
  </script>
</body>
</html>
