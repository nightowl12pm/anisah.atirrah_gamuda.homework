    <!-- Refer on Topic 2.2 Control Flows & Functions. -->
    <script> 
    {
        let number; 
        let total = 0;

        do {
            number = Math.Floor((Math.Random() * 10) + 1);
            console.log(number);
            total += number;
        }
        while (number < 8);

        console.log("The sum of number is " + total);

    }
    </script>
